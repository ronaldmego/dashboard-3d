<style>
/* La cartera de construcción como un mapa explorable: cada obra se arma según su avance y sus cifras
   flotan encima. La base de color es la de los defaults de abajo; el mundo 3D tiene la suya, de plano de obra. */
:root {
  color-scheme: light;
  --papel: var(--card, #ffffff);
  --suelo: var(--bg, #e8e7e3);
  --tinta: var(--fg, #14161a);
  --tinta-2: var(--muted, #464a52);
  --linea: var(--line, #d4d2cb);
  --obra: var(--amber, #c4a052);
  --obra-texto: var(--amber-texto, #765a17);
  --obra-velo: color-mix(in srgb, var(--obra) 16%, transparent);
  --bien: #176541; --alerta: #865700; --mal: #b12f35;   /* los de estado de index.html */
  --sombra: 0 1px 2px color-mix(in srgb, var(--tinta) 8%, transparent), 0 6px 20px color-mix(in srgb, var(--tinta) 10%, transparent);
  --cuerpo: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --dato: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--suelo); color: var(--tinta); font: 15px/1.4 var(--cuerpo); overflow: hidden; }
#escena { position: fixed; inset: 0; }
#escena canvas { display: block; touch-action: none; }
.num { font-family: var(--dato); font-variant-numeric: tabular-nums; }

/* Barra superior */
.barra { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; gap: 12px; align-items: stretch;
  padding: 12px 16px; pointer-events: none; z-index: 5; flex-wrap: wrap; }
.marca, .kpi, .reloj { pointer-events: auto; background: var(--papel); border: 1px solid var(--linea); border-radius: 8px; box-shadow: var(--sombra); }
.marca { padding: 7px 14px; display: grid; align-content: center; gap: 1px; }
.marca a { font-size: 12px; color: var(--obra-texto); text-decoration: none; }
.marca a:hover, .marca a:focus-visible { text-decoration: underline; }
.marca b { font: 700 17px/1.15 var(--cuerpo); }
.marca span { font-size: 12px; color: var(--tinta-2); }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.kpi { padding: 7px 12px; min-width: 112px; }
.kpi small { display: block; font: 600 11px/1.2 var(--cuerpo); letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-2); }
.kpi strong { font: 500 19px/1.3 var(--dato); font-variant-numeric: tabular-nums; }
.kpi em { font-style: normal; font-size: 12px; color: var(--tinta-2); }
.reloj { margin-left: auto; padding: 7px 12px; display: grid; align-content: center; justify-items: end; }
.reloj strong { font: 500 19px/1.2 var(--dato); }
.vivo { font: 600 11px/1 var(--cuerpo); letter-spacing: .05em; text-transform: uppercase; color: var(--bien); display: inline-flex; gap: 6px; align-items: center; }
.vivo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: latido 1.6s infinite; }
.vivo.proy { color: var(--obra-texto); }
.vivo.proy::before { animation: none; }
@keyframes latido { 50% { opacity: .25; } }

/* Etiquetas sobre las estructuras */
.etiqueta { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); z-index: 3; pointer-events: auto; cursor: pointer;
  background: var(--papel); border: 1px solid var(--linea); border-radius: 6px; padding: 5px 9px 6px; box-shadow: var(--sombra);
  white-space: nowrap; transition: border-color .15s; }
.etiqueta::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: var(--papel);
  border: 1px solid var(--linea); border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
.etiqueta:hover, .etiqueta.activa { border-color: var(--obra); }
.etiqueta b { display: block; font: 600 13.5px/1.2 var(--cuerpo); }
.etiqueta .fila { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--tinta-2); }
.etiqueta .barrita { width: 54px; height: 5px; background: var(--linea); border-radius: 3px; overflow: hidden; }
.etiqueta .barrita i { display: block; height: 100%; background: var(--obra); }
.punto { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.p-bien { background: var(--bien); } .p-alerta { background: var(--alerta); } .p-mal { background: var(--mal); }

/* Ficha */
.ficha { position: fixed; z-index: 6; top: 84px; right: 16px; width: 340px; max-height: calc(100% - 200px); overflow: auto;
  background: var(--papel); border: 1px solid var(--linea); border-radius: 10px; box-shadow: var(--sombra); }
.ficha header { position: sticky; top: 0; background: var(--papel); padding: 14px 16px 10px; border-bottom: 1px solid var(--linea); display: grid; gap: 2px; }
.ficha header .tipo { font-size: 12px; color: var(--tinta-2); padding-right: 30px; }
.ficha h2 { margin: 0; font: 700 21px/1.15 var(--cuerpo); text-wrap: balance; }
.cerrar { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent;
  font-size: 18px; color: var(--tinta-2); cursor: pointer; }
.cerrar:hover, .cerrar:focus-visible { border-color: var(--linea); color: var(--tinta); }
.estado { justify-self: start; margin-top: 6px; font: 600 11px/1 var(--cuerpo); letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; }
.e-bien { color: var(--bien); background: color-mix(in srgb, var(--bien) 10%, var(--papel)); }
.e-alerta { color: var(--alerta); background: color-mix(in srgb, var(--alerta) 11%, var(--papel)); }
.e-mal { color: var(--mal); background: color-mix(in srgb, var(--mal) 9%, var(--papel)); }
.ficha section { padding: 12px 16px; border-bottom: 1px solid var(--linea); display: grid; gap: 10px; }
.ficha section:last-child { border-bottom: 0; }
.ficha h3 { margin: 0; font: 600 11px/1 var(--cuerpo); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.ficha .foco { background: color-mix(in srgb, var(--mal) 6%, var(--papel)); }
.ficha .foco.alerta { background: color-mix(in srgb, var(--alerta) 7%, var(--papel)); }
.ficha .foco p { margin: 0; font-size: 14px; }
.ficha .foco strong { font-size: 14px; }
.dato { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.dato > span { font-size: 14px; }
.dato > strong { font: 500 15px/1.2 var(--dato); font-variant-numeric: tabular-nums; text-align: right; }
.dato > small { grid-column: 1 / 3; font-size: 12px; color: var(--tinta-2); margin-top: -4px; }
.avance { grid-column: 1 / 3; position: relative; height: 10px; background: var(--linea); border-radius: 5px; }
.avance i { position: absolute; inset: 0 auto 0 0; background: var(--obra); border-radius: 5px; }
.avance b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinta); }
.stock { display: grid; grid-template-columns: 1fr 80px auto; gap: 6px 10px; align-items: center; font-size: 14px; }
.stock .barrita { height: 6px; background: var(--linea); border-radius: 3px; overflow: hidden; }
.stock .barrita i { display: block; height: 100%; }
.stock strong { font: 500 13px/1 var(--dato); text-align: right; }
.hito { font-size: 14px; } .hito .num { color: var(--tinta-2); font-size: 13px; }
.fuente { font-size: 12px; color: var(--tinta-2); }
.fuente code { font: 11.5px var(--dato); }

/* Pie: línea de tiempo y novedades */
.pie { position: fixed; z-index: 5; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: flex-end; pointer-events: none; flex-wrap: wrap; }
.tiempo, .novedades { pointer-events: auto; background: var(--papel); border: 1px solid var(--linea); border-radius: 8px; box-shadow: var(--sombra); }
.tiempo { padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; flex: 1 1 420px; min-width: 0; }
.tiempo label { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--tinta-2); }
.tiempo label b { font: 500 13px var(--dato); color: var(--tinta); }
.play { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--obra); color: var(--ink-on-amber, var(--tinta)); cursor: pointer; display: grid; place-items: center; }
.play:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
.riel { position: relative; }
input[type=range] { width: 100%; accent-color: var(--obra); margin: 0; }
.hoy { position: absolute; top: -2px; font: 600 10px/1 var(--cuerpo); letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-2); transform: translate(-50%, -100%); pointer-events: none; }
.novedades { flex: 0 1 380px; min-width: 0; padding: 10px 14px; max-height: 128px; overflow: hidden; }
.novedades h3 { margin: 0 0 6px; font: 600 11px/1 var(--cuerpo); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.novedades ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.novedades li { display: flex; gap: 8px; min-width: 0; }
.novedades li .num { color: var(--tinta-2); flex: none; }
.novedades li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.novedades li:first-child { animation: entra .4s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(-4px); } }
.ayuda { position: fixed; z-index: 4; left: 16px; bottom: 96px; font-size: 12px; color: var(--tinta-2); background: color-mix(in srgb, var(--papel) 80%, transparent); padding: 4px 8px; border-radius: 4px; }
.cargando { position: fixed; inset: 0; display: grid; place-items: center; font: 600 14px var(--cuerpo); color: var(--tinta-2); z-index: 1; }

/* Navegación: minimapa y selector de obra */
.nav { position: fixed; z-index: 5; left: 16px; top: 84px; display: grid; gap: 8px; width: 216px; }
.minimapa { background: var(--papel); border: 1px solid var(--linea); border-radius: 8px; box-shadow: var(--sombra); padding: 8px; display: grid; gap: 6px; }
.minimapa h3 { margin: 0; font: 600 11px/1 var(--cuerpo); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.minimapa canvas { width: 200px; height: 118px; display: block; cursor: crosshair; border-radius: 4px; }
.ir { font: 500 14px var(--cuerpo); padding: 7px 10px; border: 1px solid var(--linea); border-radius: 8px; background: var(--papel); color: var(--tinta); box-shadow: var(--sombra); width: 100%; }
.ir:focus-visible { outline: 2px solid var(--obra); outline-offset: 1px; }

/* Recuadro al tocar un elemento */
.pop { position: fixed; left: 0; top: 0; z-index: 7; width: 260px; background: var(--papel); border: 1px solid var(--obra); border-radius: 8px; box-shadow: var(--sombra);
  padding: 10px 12px 12px; display: grid; gap: 8px; pointer-events: auto; }
.pop::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--papel); border: 1px solid var(--obra); border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
.pop.abajo::after { bottom: auto; top: -7px; transform: translateX(-50%) rotate(225deg); }
.pop .sobre { font-size: 11.5px; color: var(--tinta-2); padding-right: 22px; }
.pop b.nombre { display: block; font: 700 16px/1.15 var(--cuerpo); padding-right: 22px; }
.pop .cerrar { top: 4px; right: 4px; width: 26px; height: 26px; font-size: 16px; }
.pop dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.pop dt { color: var(--tinta-2); }
.pop dd { margin: 0; font: 500 13px/1.35 var(--dato); font-variant-numeric: tabular-nums; text-align: right; }
.pop .estado { margin: 0; }
.pop .accion { justify-self: start; font: 600 13px var(--cuerpo); color: var(--obra-texto); background: var(--obra-velo); border: 1px solid var(--obra); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.pop .accion:hover, .pop .accion:focus-visible { background: var(--obra); color: var(--ink-on-amber, var(--tinta)); }
.pop .nota { font-size: 12px; color: var(--tinta-2); }

@media (max-width: 760px) {
  .barra { padding: 10px 12px; gap: 8px; flex-wrap: nowrap; }
  .kpis { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .kpi { flex: none; min-width: 0; padding: 5px 9px; } .kpi small { white-space: nowrap; font-size: 10px; } .kpi strong { white-space: nowrap; font-size: 15px; }
  .kpi.op, .reloj, .marca { display: none; }
  .nav { left: 12px; right: 12px; top: 70px; width: auto; }
  .minimapa { display: none; }
  .ficha { left: 12px; right: 12px; width: auto; top: auto; bottom: 108px; max-height: 52%; }
  .novedades, .ayuda { display: none; }
  .pie { left: 12px; right: 12px; }
  .pop { width: 236px; }
}
@media (prefers-reduced-motion: reduce) { .vivo::before, .novedades li:first-child { animation: none; } }
</style>

function camion(r) {
  const g = new THREE.Group();
  const color = r.tipo === "mixer" ? "#f2f2ee" : "#3d6f9e";
  caja(1.7, 1.4, 1.9, color, 2.3, 0.45, 0, g); caja(1.76, 0.5, 1.96, "#30485c", 2.36, 1.25, 0, g); // el parabrisas no comparte cara con la cabina
  caja(5.4, 0.35, 2, "#3a4148", -0.4, 0.4, 0, g);
  for (const x of [-2.2, -0.8, 2.3]) for (const z of [-1, 1]) { const w = cil(0.42, 0.3, "#1f2428", x, 0, z, g, 10); w.rotation.x = Math.PI / 2; w.position.y = 0.42; }
  if (r.tipo === "mixer") { const d = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.15, 3.4, 12), mat("#f0a31a")); d.rotation.z = Math.PI / 2 + 0.18; d.position.set(-0.6, 1.75, 0); d.castShadow = true; g.add(d); g.userData.tambor = d; }
  else g.userData.carga = caja(4, 0.6, 1.6, r.material === VIGAS ? "#3d6f9e" : "#8b4a2b", -0.6, 0.75, 0, g);
  g.traverse((m) => { if (m.isMesh) m.receiveShadow = false; });
  scene.add(g); return g;
}
const VEL = 12;
const camiones = RUTAS.map((r) => {
  const segs = []; let largo = 0;
  for (let i = 0; i < r.puntos.length - 1; i++) { const a = r.puntos[i], b = r.puntos[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (l > 0) { segs.push({ a, b, l }); largo += l; } }
  const c = { r, segs, largo, t: (r.desfase || 0) * (largo * 2 / VEL + r.espera * 2), fase: "", restante: 0 };
  c.g = camion(r); c.g.userData.sel = { tipo: "camion", c }; return c;
});
function posEn(c, d) {
  for (const sg of c.segs) { if (d <= sg.l) { const f = d / sg.l; return { x: sg.a[0] + (sg.b[0] - sg.a[0]) * f, z: sg.a[1] + (sg.b[1] - sg.a[1]) * f, ang: Math.atan2(-(sg.b[1] - sg.a[1]), sg.b[0] - sg.a[0]) }; } d -= sg.l; }
  const u = c.segs[c.segs.length - 1]; return { x: u.b[0], z: u.b[1], ang: Math.atan2(-(u.b[1] - u.a[1]), u.b[0] - u.a[0]) };
}
let enRuta = 0;
function moverCamiones(dt, activas) {
  enRuta = 0;
  for (const c of camiones) {
    if (!activas[c.r.destino]) { c.g.visible = false; continue; }
    c.g.visible = true;
    const viaje = c.largo / VEL, ciclo = viaje * 2 + c.r.espera * 2;
    c.t = (c.t + dt) % ciclo; const t = c.t;
    let p, fase, cargado;
    if (t < viaje) { p = posEn(c, t * VEL); fase = "ida"; cargado = true; c.restante = viaje - t; }
    else if (t < viaje + c.r.espera) { p = posEn(c, c.largo); fase = "descarga"; cargado = true; c.restante = viaje + c.r.espera - t; }
    else if (t < viaje * 2 + c.r.espera) { p = posEn(c, c.largo - (t - viaje - c.r.espera) * VEL); p.ang += Math.PI; fase = "vuelta"; cargado = false; c.restante = viaje * 2 + c.r.espera - t; }
    else { p = posEn(c, 0); fase = "carga"; cargado = false; c.restante = ciclo - t; }
    const lado = 1.3; c.g.position.set(p.x - lado * Math.sin(p.ang), 0, p.z - lado * Math.cos(p.ang));
    c.g.rotation.y = p.ang;
    if (c.g.userData.tambor) c.g.userData.tambor.rotation.x += dt * 2.5;
    if (c.g.userData.carga) c.g.userData.carga.visible = cargado;
    if (fase === "ida" || fase === "vuelta") enRuta++;
    if (c.fase && c.fase !== fase) eventoCamion(c, fase);
    c.fase = fase;
  }
}

renderer.domElement.addEventListener("pointerup", (e) => {
  if (!abajo || Math.hypot(e.clientX - abajo[0], e.clientY - abajo[1]) > 6) return;
  const p = tocado(e);
  if (p) mostrar({ ...p.userData.sel }, p); else cerrarPop();
});
renderer.domElement.addEventListener("pointermove", (e) => { if (e.buttons) return; renderer.domElement.style.cursor = tocado(e) ? "pointer" : ""; });

// Línea de tiempo: la semana 34 es el corte del 31 ago 2026
const rango = $("semana");
const ROT_PLAY = L("Reproducir el avance semana a semana", "Play progress week by week"), ROT_PAUSA = L("Pausar", "Pause");
function ponerSemana(w) {
  sem = w; rango.value = w; est = armar(sem); recolectar();
  $("sem-txt").innerHTML = L(`Semana <b>${w}</b> de ${SEMANAS}`, `Week <b>${w}</b> of ${SEMANAS}`);
  $("sem-modo").textContent = w === HOY ? L("Corte del 31 ago 2026", "Cutoff Aug 31, 2026") : w < HOY ? L("Historia registrada", "Recorded history") : L("Proyección al ritmo actual", "Projection at the current pace");
  const v = $("vivo"); v.textContent = w === HOY ? L("En vivo", "Live") : w < HOY ? L("Semana ", "Week ") + w : L("Proyección", "Projection"); v.classList.toggle("proy", w !== HOY);
  pintarEtiquetas(); pintarBarra(); if (seleccion) pintarFicha(seleccion);
  if (pop.sel && (pop.sel.tipo === "grua" || pop.sel.tipo === "pila")) cerrarPop();
}
rango.addEventListener("input", () => { parar(); ponerSemana(+rango.value); });
rango.setAttribute("aria-label", L("Semana", "Week"));
function ubicarHoy() { const r = rango.getBoundingClientRect(), pad = 8; $("marca-hoy").style.left = pad + (HOY - 1) / (SEMANAS - 1) * (r.width - 2 * pad) + "px"; }
addEventListener("resize", ubicarHoy);
let reproduciendo = null;
function parar() { clearInterval(reproduciendo); reproduciendo = null; $("play-icono").setAttribute("d", "M4 2.5v11l9-5.5z"); $("play").setAttribute("aria-label", ROT_PLAY); }
$("play").addEventListener("click", () => {
  if (reproduciendo) { parar(); return; }
  let w = sem >= SEMANAS ? 1 : sem; ponerSemana(w);
  $("play-icono").setAttribute("d", "M4 2.5h3v11H4zM9 2.5h3v11H9z"); $("play").setAttribute("aria-label", ROT_PAUSA);
  reproduciendo = setInterval(() => { if (w >= SEMANAS) { parar(); return; } ponerSemana(++w); }, 420);
});

// ── Bucle ───────────────────────────────────────────────────────────────────
const reloj = new THREE.Clock(), quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
let acumulado = 0, mapaT = 0;
function cuadro() {
  const dt = Math.min(reloj.getDelta(), 0.05), t = reloj.elapsedTime, act = activas();
  if (!quieto) {
    moverCamiones(dt, act); moverGente(dt, act);
    for (const fs of Object.values(animar)) for (const f of fs) f(t);
  }
  if (sem === HOY) { minutos += dt * 2; acumulado += dt; if (acumulado > 1) { acumulado = 0; $("hora").textContent = hora(); pintarBarra(); } }
  avanzarVuelo(dt); controls.update(); acotar(); seguirSol();
  renderer.render(scene, camera); ubicarEtiquetas(); ubicarPop(t);
  mapaT += dt; if (mapaT > 0.1) { mapaT = 0; pintarMinimapa(); }
  requestAnimationFrame(cuadro);
}
parar(); ponerSemana(HOY); ubicarHoy();
novedad(L("Turno de la mañana iniciado en las siete obras", "Morning shift started at all seven projects"));
$("cargando").remove();

requestAnimationFrame(cuadro);
})();
</script>
